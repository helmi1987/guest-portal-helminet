# Example for a regular Docker host. Copy to docker-compose.yml and adjust.
# Port mapping: guest portal 443, admin UI 8443 (bind it to an admin/VPN address of the host, not to all
# interfaces), RADIUS 1812/1813 UDP, federation API 9443 (only with several instances; reachable from the
# other instances only, e.g. WireGuard).
services:
  portal:
    image: ghcr.io/helmi1987/guest-portal-helminet:latest   # newest release; pin X.Y.Z for controlled updates, :edge = main
    container_name: guest-portal
    restart: unless-stopped
    ports:
      - "443:443"
      - "8443:8443"                 # admin UI: better bound to an admin/VPN address of the host,
                                    # e.g. "10.0.0.5:8443:8443", or "127.0.0.1:8443:8443" behind a local reverse proxy
      - "1812:1812/udp"
      - "1813:1813/udp"
      # - "9443:9443"               # federation (FEDERATION_PORT), between instances only
    volumes:
      - ./data:/data
      # Certificates: portal.crt/.key (else self-signed) and router.crt/.key in ./data/certs (see README).
    environment:
      APP_URL: https://portal.example.com
      PORTAL_HOSTNAME: portal.example.com
      TZ: UTC                       # display time zone, e.g. Europe/Zurich (APP_TIMEZONE overrides); data stays UTC
      # TRUSTED_PROXIES: 10.0.0.2   # when the admin UI is behind a reverse proxy: only the proxy's address (never *
                                    # or a /0 network; ignored and logged as an error at start). Only affects the admin
                                    # UI's client IP; the routers' source-IP check stays on with a proxy.
      # PORTAL_ROUTER_IP_CHECK: "false"   # only if the routers reach the guest port through that proxy or NAT
                                    # (not recommended); PORTAL_ROUTER_CERT_CHECK_IP is no longer read
      # Federation (several instances): name and URL under which the other instances reach this one.
      # PORTAL_INSTANCE_NAME: Site A
      # PORTAL_FEDERATION_URL: https://10.8.0.2:9443
      # FEDERATION_PORT: 9443       # listener port inside the container (default 9443)
      # Optional MariaDB/MySQL instead of SQLite:
      # DB_CONNECTION: mariadb
      # DB_HOST: db
      # DB_DATABASE: portal
      # DB_USERNAME: portal
      # DB_PASSWORD is a secret: put it into data/.env, not here.
