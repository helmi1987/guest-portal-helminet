# Shared Laravel location block, included per listener.
root /var/www/html/public;
index index.php;
charset utf-8;

include /etc/nginx/portal-headers.conf;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }

# Vite assets have content hashes in their names: cache for a year. One Cache-Control header only
# (no "expires", which would add a second one); the security headers are repeated here because
# add_header in a location replaces the inherited ones.
location /build/ {
    include /etc/nginx/portal-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location ~ ^/index\.php(/|$) {
    fastcgi_pass unix:/run/php-fpm/php-fpm.sock;
    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_param PORTAL_ZONE $portal_zone;
    fastcgi_param HTTP_PROXY "";
    internal;
}

location ~ \.php$ {
    return 404;
}

location ~ /\.(?!well-known) {
    deny all;
}
