# Security headers of the guest and admin listeners. nginx drops all inherited add_header
# directives in a block that defines its own, so every location with add_header includes this file
# again (see portal-app.conf). Values per listener come from the maps in portal.conf.template; an
# empty value sends no header. Headers the app already sets itself (e.g. the strict CSP of uploaded
# branding files) are not added a second time.
add_header X-Content-Type-Options $portal_nosniff always;
add_header X-Frame-Options $portal_frame_options always;
add_header Referrer-Policy "same-origin" always;
add_header Content-Security-Policy $portal_csp always;
add_header Strict-Transport-Security $portal_hsts always;
