# Main nginx configuration for the portal container.
user nginx;
worker_processes 1;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    # Relative Location headers: nginx's own redirects must not carry its internal port (8443), which
    # differs from the published one behind a port mapping or a reverse proxy.
    absolute_redirect off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 8m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 1d;
    ssl_certificate /run/portal/fullchain.pem;
    ssl_certificate_key /run/portal/privkey.pem;

    include /run/portal/nginx-portal.conf;
}
