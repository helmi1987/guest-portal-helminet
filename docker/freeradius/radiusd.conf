# Minimal FreeRADIUS 3 configuration for the portal. All decisions are made by Laravel
# through rlm_rest on the internal API (loopback). Clients are rendered by Laravel.
prefix = /usr
exec_prefix = /usr
sysconfdir = /etc
localstatedir = /var
sbindir = /usr/sbin
logdir = /var/log/radius
raddbdir = /etc/raddb
radacctdir = ${logdir}/radacct
name = radiusd
confdir = ${raddbdir}
modconfdir = ${confdir}/mods-config
run_dir = /run/${name}
db_dir = ${raddbdir}
libdir = /usr/lib/freeradius
pidfile = ${run_dir}/${name}.pid

max_request_time = 10
cleanup_delay = 5
max_requests = 4096
hostname_lookups = no

log {
    destination = stdout
    colourise = no
    stripped_names = no
    auth = yes
    auth_badpass = no
    auth_goodpass = no
}

security {
    # Drop root after binding the ports (user from the Alpine freeradius package).
    user = radius
    group = radius
    allow_core_dumps = no
    max_attributes = 200
    reject_delay = 1
    status_server = yes
    # Blast-RADIUS mitigation (to verify RouterOS support, see CONCEPT.md §12)
    require_message_authenticator = auto
    limit_proxy_state = auto
}

thread pool {
    start_servers = 2
    max_servers = 8
    min_spare_servers = 1
    max_spare_servers = 4
    max_requests_per_server = 0
}

# Clients (routers) are written by Laravel to the data volume.
$INCLUDE /data/radius/clients.conf

modules {
    $INCLUDE ${confdir}/portal-mods/
}

policy {
}

$INCLUDE ${confdir}/portal-sites/
