[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
user = portal
group = portal
listen = /run/php-fpm/php-fpm.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
