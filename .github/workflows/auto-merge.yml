name: Auto-merge

# Push to claude/** -> tests -> merge into main -> build the edge image.
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so the image
# build is called explicitly as a reusable workflow.
on:
  push:
    branches:
      - 'claude/**'

concurrency:
  group: auto-merge-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  merge:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Merge branch into main
        id: merge
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          if git merge --ff-only "origin/$BRANCH"; then
            echo "Fast-forwarded main to $BRANCH"
          else
            git merge --no-ff --no-edit -m "Merge branch '$BRANCH' into main" "origin/$BRANCH"
          fi
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  docker:
    needs: merge
    uses: ./.github/workflows/docker.yml
    with:
      ref: main
    permissions:
      contents: read
      packages: write
    secrets: inherit
