name: RouterOS CHR

# Runs the generated RouterOS scripts of the setup assistant against a real RouterOS CHR in qemu
# (tests/routeros). Separate, optional workflow: auto-merge.yml only waits for tests.yml, so a failing
# or unavailable run here never blocks the merge. KVM is used when the runner offers /dev/kvm,
# otherwise qemu falls back to TCG (much slower).
on:
  push:
    branches: ['claude/**']
    paths:
      - 'app/Nas/**'
      - 'tests/routeros/**'
      - '.github/workflows/routeros.yml'
  workflow_dispatch:
    inputs:
      versions:
        description: 'RouterOS versions (JSON list; "stable" = current stable)'
        required: false
        default: '["7.24.5", "stable"]'

permissions:
  contents: read

concurrency:
  group: routeros-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chr:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.versions || '["7.24.5", "stable"]') }}
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install qemu and sshpass
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils sshpass

      - name: Enable KVM if available
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm || echo "no /dev/kvm: using TCG"

      - name: Resolve version
        id: v
        env:
          WANTED: ${{ matrix.version }}
        run: |
          v=$WANTED
          if [ "$v" = stable ]; then
            v=$(curl -fsSL https://upgrade.mikrotik.com/routeros/NEWESTa7.stable | cut -d' ' -f1)
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "RouterOS $v"

      - uses: actions/cache@v4
        with:
          path: ~/chr-${{ steps.v.outputs.version }}
          key: chr-${{ steps.v.outputs.version }}-wireless-container-v1

      - name: Prepare CHR image (download, install wireless + container)
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          [ -f "$HOME/chr-$V/base.img" ] || tests/routeros/chr.sh prepare "$V" "$HOME/chr-$V"

      - name: Boot CHR
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          qemu-img create -q -f qcow2 -b "$HOME/chr-$V/base.img" -F raw "$RUNNER_TEMP/work.qcow2"
          tests/routeros/chr.sh start "$RUNNER_TEMP/work.qcow2" "$RUNNER_TEMP/console.log"

      - name: Run harness
        env:
          WORK: ${{ runner.temp }}/harness
        run: tests/routeros/run.sh

      - name: Upload harness output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routeros-${{ steps.v.outputs.version }}
          path: |
            ${{ runner.temp }}/harness
            ${{ runner.temp }}/console.log
            !${{ runner.temp }}/harness/pki
          retention-days: 7
