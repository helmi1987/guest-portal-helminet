name: Releases

# Manual run: publish a GitHub release for every vX.Y.Z tag that has none yet and update the notes
# of releases whose .github/release-notes file changed
# (auto-merge.yml and dependabot-auto-merge.yml do the same after each merge).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish missing GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-releases.sh
