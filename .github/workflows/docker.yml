name: Docker image

# Tagging scheme: see CONCEPT.md §4.
#   main            -> edge, sha-<short>
#   tag vX.Y.Z      -> X.Y.Z, X.Y, X, latest, X.Y.Z-<YYYYMMDD>  (X.Y, X, latest only for the newest release)
#   Monday (cron)   -> rebuild main (edge, sha-<short>) and the newest release tag (new dated tag, moves the others)
on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build (default: main)'
        required: false
        default: ''
  workflow_call:
    inputs:
      ref:
        description: 'Branch or tag to build'
        required: false
        type: string
        default: 'main'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      image: ${{ steps.plan.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine build targets
        id: plan
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          newest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          targets=()
          add() { targets+=("{\"ref\":\"$1\",\"kind\":\"$2\",\"newest\":\"$3\"}"); }
          release_or_edge() {
            if [[ "$1" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              add "$1" release "$([ "$1" = "$newest" ] && echo true || echo false)"
            else
              add "$1" edge false
            fi
          }
          if [ -n "${INPUT_REF:-}" ]; then
            release_or_edge "$INPUT_REF"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            add main edge false
            [ -n "$newest" ] && add "$newest" release true
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_or_edge "$GITHUB_REF_NAME"
          else
            add main edge false
          fi
          matrix="{\"include\":[$(IFS=,; echo "${targets[*]}")]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  build:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}

      - name: Compute tags
        id: tags
        env:
          REF: ${{ matrix.ref }}
          KIND: ${{ matrix.kind }}
          NEWEST: ${{ matrix.newest }}
        run: |
          set -euo pipefail
          sha="sha-$(git rev-parse --short=7 HEAD)"
          if [ "$KIND" = "release" ]; then
            v="${REF#v}"; major="${v%%.*}"; minor="${v%.*}"
            {
              echo "tags<<EOF"
              echo "type=raw,value=$v"
              echo "type=raw,value=$v-$(date -u +%Y%m%d)"
              if [ "$NEWEST" = "true" ]; then
                echo "type=raw,value=$minor"
                echo "type=raw,value=$major"
                echo "type=raw,value=latest"
              fi
              echo "EOF"
              echo "version=$v"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "type=raw,value=edge"
              echo "type=raw,value=$sha"
              echo "EOF"
              echo "version=$(cat VERSION)-edge"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.plan.outputs.image }}
          flavor: latest=false
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          # Weekly rebuild: no layer cache so Alpine package updates are picked up.
          no-cache: ${{ github.event_name == 'schedule' }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.kind }}
          cache-to: type=gha,mode=max,scope=${{ matrix.kind }}
          provenance: true
          sbom: true
